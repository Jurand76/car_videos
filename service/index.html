<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTKA.PL — Obsługa serwisowa</title>
    <link rel="stylesheet" href="/service/styles.css?v=20260630c" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/hub">AUTKA.PL</a>
        <nav class="topnav">
          <a href="/hub">Start</a>
          <a href="/dashboard">Zdjęcia</a>
          <a href="/video" data-auth-link="/video">Wideo</a>
          <span class="topnav-active">Serwis</span>
          <span id="user-email" class="nav-user-email"></span>
          <button id="logout-btn" type="button" class="nav-logout-btn">Wyloguj</button>
        </nav>
      </div>
    </header>

    <main class="service-page">
      <!-- ============ STRONA GŁÓWNA: 3 KAFELKI ============ -->
      <section id="view-home" class="view">
        <div class="hero">
          <p class="eyebrow">Warsztat samochodowy</p>
          <h1>Obsługa serwisowa</h1>
          <p class="lead">Wybierz moduł, aby zarządzać danymi warsztatu.</p>
        </div>

        <div class="tiles-grid">
          <button class="tile tile-customers" data-open="customers">
            <img class="tile-img" src="/public/service/tiles/customers.jpg" alt="Klienci" />
            <span class="badge badge-violet">Klienci</span>
            <h2 class="tile-title">Baza klientów</h2>
            <p class="tile-desc">Osoby prywatne i firmy — dane kontaktowe, NIP, historia pojazdów.
              <span class="tile-count" id="count-customers"></span>
            </p>
            <span class="tile-cta">Przeglądaj klientów →</span>
          </button>

          <button class="tile tile-cars" data-open="cars">
            <img class="tile-img" src="/public/service/tiles/cars.jpg" alt="Samochody" />
            <span class="badge badge-teal">Samochody</span>
            <h2 class="tile-title">Pojazdy</h2>
            <p class="tile-desc">Pojazdy klientów z danymi technicznymi i historią napraw.
              <span class="tile-count" id="count-cars"></span>
            </p>
            <span class="tile-cta">Przeglądaj samochody →</span>
          </button>

          <button class="tile tile-repairs" data-open="repairs">
            <img class="tile-img" src="/public/service/tiles/repairs.jpg" alt="Usługi" />
            <span class="badge badge-amber">Usługi</span>
            <h2 class="tile-title">Zlecenia serwisowe</h2>
            <p class="tile-desc">Naprawy i zlecenia z pozycjami, rozliczeniem VAT i podglądem do wydruku.
              <span class="tile-count" id="count-repairs"></span>
            </p>
            <span class="tile-cta">Przeglądaj usługi →</span>
          </button>
        </div>
      </section>

      <!-- ============ WIDOK: KLIENT ============ -->
      <section id="view-customers" class="view" hidden>
        <header class="view-head">
          <div class="view-head-row">
            <h1 class="view-title">Klienci</h1>
            <button class="btn btn-primary" data-action="customer-new">+ Nowy klient</button>
          </div>
        </header>

        <div class="toolbar">
          <input class="search-input" id="customer-search" type="search" placeholder="Szukaj: nazwa, telefon, NIP, email…" />
        </div>

        <div id="customer-list" class="list-grid"></div>
      </section>

      <!-- ============ WIDOK: SAMOCHODY ============ -->
      <section id="view-cars" class="view" hidden>
        <header class="view-head">
          <div class="view-head-row">
            <h1 class="view-title">Samochody</h1>
            <button class="btn btn-primary" data-action="car-new">+ Nowy samochód</button>
          </div>
        </header>

        <div class="toolbar">
          <input class="search-input" id="car-search" type="search" placeholder="Szukaj: marka, model, rejestracja, VIN…" />
        </div>

        <div id="car-list" class="list-grid"></div>
      </section>

      <!-- ============ WIDOK: USŁUGI (naprawy) ============ -->
      <section id="view-repairs" class="view" hidden>
        <header class="view-head">
          <div class="view-head-row">
            <h1 class="view-title">Usługi</h1>
            <button class="btn btn-primary" data-action="repair-new">+ Nowa naprawa</button>
          </div>
        </header>

        <div class="toolbar">
          <input class="search-input" id="repair-search" type="search" placeholder="Szukaj po statusie…" />
        </div>

        <div id="repair-list" class="list-grid"></div>
      </section>

      <!-- ============ MODAL (formularze) ============ -->
      <div id="modal-root" class="modal-root" hidden>
        <div class="modal-backdrop" data-modal-close></div>
        <div class="modal" role="dialog" aria-modal="true">
          <header class="modal-head">
            <h2 id="modal-title" class="modal-title">Formularz</h2>
            <button class="btn btn-ghost" data-modal-close>✕</button>
          </header>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>

      <!-- ============ TOAST ============ -->
      <div id="toast" class="toast" hidden></div>
    </main>

    <!-- ============ OBSZAR WYDRUKU (podgląd zlecenia) ============ -->
    <div id="print-root" class="print-root" hidden></div>

    <script src="/service/config.js"></script>
    <script src="/service/app.js?v=20260630b"></script>
  </body>
</html>
